name: Build IPA

on:
  push:
    branches: [ main, perf-toolchain-status ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Build IPA
      working-directory: src/ios
      run: |
        xcodebuild -project Minis.xcodeproj \
          -scheme Minis \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -derivedDataPath ../build \
          clean build | xcpretty || exit 0
        
        # Move .app to Payload and create IPA
        APP_PATH=$(find ../build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: .app not found"
          exit 1
        fi
        
        mkdir -p ../build/Payload
        mv "$APP_PATH" ../build/Payload/
        cd ../build
        zip -r Minis.ipa Payload/
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Minis-IPA
        path: build/Minis.ipa
        retention-days: 7
