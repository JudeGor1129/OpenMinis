name: iCTRL XCTest runner IPA

on:
  push:
    paths:
      - 'tools/ictrl-runner/**'
      - '.github/workflows/ictrl-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ictrl-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-runner:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tools/ictrl-runner
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode and install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install xcodegen
          xcodegen --version

      - name: Fetch pinned iDevice framework
        shell: bash
        env:
          IDEVICE_VERSION: v0.1.68
        run: |
          set -euxo pipefail
          bash Scripts/fetch-idevice.sh 2>&1 | tee /tmp/ictrl-fetch.log
          test -f Frameworks/IDevice.xcframework/ios-arm64/libidevice_ffi.a

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail
          xcodegen generate --quiet 2>&1 | tee /tmp/ictrl-xcodegen.log
          test -f iCTRL.xcodeproj/project.pbxproj

      - name: Build iCTRL targets
        shell: bash
        run: |
          set -euxo pipefail
          make build UNSIGNED=1 2>&1 | tee /tmp/ictrl-build.log

      - name: Package unsigned iCTRL IPAs
        shell: bash
        run: |
          set -euxo pipefail
          make ipa UNSIGNED=1 2>&1 | tee /tmp/ictrl-ipa.log
          test -s release/iCTRLUITests-Runner.ipa
          test -s release/iCTRL.ipa
          shasum -a 256 release/iCTRLUITests-Runner.ipa release/iCTRL.ipa | tee release/SHA256SUMS.txt
          unzip -t release/iCTRLUITests-Runner.ipa | tail -1

      - name: Upload runner build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iCTRL-runner-diagnostics-${{ github.run_number }}
          path: |
            /tmp/ictrl-fetch.log
            /tmp/ictrl-xcodegen.log
            /tmp/ictrl-build.log
            /tmp/ictrl-ipa.log
            tools/ictrl-runner/build/
            tools/ictrl-runner/iCTRL.xcodeproj/project.pbxproj
          if-no-files-found: warn
          retention-days: 14

      - name: Upload runner and optional companion app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iCTRL-iOS15-unsigned-${{ github.run_number }}
          path: |
            tools/ictrl-runner/release/iCTRLUITests-Runner.ipa
            tools/ictrl-runner/release/iCTRL.ipa
            tools/ictrl-runner/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
