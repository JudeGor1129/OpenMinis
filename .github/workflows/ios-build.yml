name: iOS Baseline Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
      - name: Show environment
        run: |
          sw_vers || true
          echo "--- available Xcodes ---"
          ls /Applications | grep -i Xcode || true
          echo "--- selected xcode ---"
          xcodebuild -version || true
          echo "--- installed iOS SDKs ---"
          xcodebuild -showsdks | grep -i ios || true

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install build tools
        run: |
          brew install ninja llvm lld libarchive pkg-config cmake || true
          python3 -m pip install --break-system-packages meson || pip3 install meson || true
          meson --version || true
          ninja --version || true
          echo "--- locate lld ---"
          ls -l /opt/homebrew/opt/llvm/bin/ld.lld 2>/dev/null || echo "no ld.lld in llvm bin"
          ls -l /opt/homebrew/opt/lld/bin/ld.lld 2>/dev/null || echo "no ld.lld in lld bin"
          # Make llvm + lld tools discoverable for the rest of the job
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"

      - name: Prepare build-time config templates
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig || true

      - name: Cache native deps
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: native-deps-${{ runner.os }}-${{ hashFiles('deps/*.sh') }}

      - name: Build native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -x
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          export PKG_CONFIG="/opt/homebrew/bin/pkg-config"
          export PKG_CONFIG_PATH="/opt/homebrew/opt/libarchive/lib/pkgconfig:${PKG_CONFIG_PATH}"
          which ld.lld || true
          echo "--- go version ---"; go version || true
          chmod +x deps/*.sh || true
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/build_rclone_ios.sh
          ./deps/prepare_alpine_rootfs.sh

      - name: Build app (no signing)
        run: |
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Debug -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee /tmp/xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore
